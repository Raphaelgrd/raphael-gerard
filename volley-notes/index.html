<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8590c" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/mobut.svg" type="image/svg+xml" />
    <title>La Mobut App</title>
  </head>
  <body>
    <main class="wrap">
      <header>
        <span class="eyebrow">Les jeux de la bande</span>
        <h1>La Mobut App</h1>
      </header>

      <section id="who" class="who" hidden>
        <h2>Qui es-tu ?</h2>
        <p class="muted">Choisis ton nom une fois : tous les jeux sauront que c'est toi sur ce téléphone.</p>
        <div class="who-list" id="who-list"></div>
      </section>

      <section id="menu" class="menu" hidden>
        <p class="hello" id="hello"></p>
        <h2>Choisis un jeu</h2>
        <ul class="games" id="games"></ul>
      </section>
    </main>
    <script type="module" src="/src/hub/main.ts"></script>
  </body>
</html>
